org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Allow project paths that are not pure ASCII (e.g. Chinese folder names).
android.overridePathCheck=true
# Flutter normally configures NDK abiFilters, which makes AGP insist on a local
# NDK even though this app ships only prebuilt engine libraries. Disabling that
# filter keeps the APK buildable on machines without the Android NDK.
disable-abi-filtering=true
# AGP 8.11 supports JDK 17-21 only; pin a real JDK 21 instead of Android
# Studio's bundled JBR (JDK 25), which fails with "25.0.3".
org.gradle.java.home=C:/Oracle_JDK-21
# The pub cache lives on C: while the project lives on D:. Kotlin's incremental
# cache tries to relativise those paths and crashes the compiler daemon
# ("this and base files have different roots"), so it is switched off here.
kotlin.incremental=false
